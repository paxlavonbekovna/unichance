<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniChance - Secure Entry</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: radial-gradient(circle at center, #131c35 0%, #070b14 100%); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .premium-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
        }
        input {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: white !important;
            border-radius: 12px !important;
            padding: 10px 14px !important;
            outline: none !important;
            transition: all 0.3s ease !important;
            width: 100%;
        }
        input:focus { border-color: rgba(59, 130, 246, 0.5) !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.15) !important; }
        label { display: block; font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 6px; margin-top: 14px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md premium-card rounded-3xl p-8 relative overflow-hidden">
        
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500/20 to-indigo-500/5 border border-blue-500/30 text-blue-400 flex items-center justify-center text-xl mx-auto mb-4 shadow-[0_0_20px_rgba(59,130,246,0.25)]">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Account Gateway</h1>
            <p class="text-xs text-slate-400 mt-1.5">Sign in to sync your analytical portfolio metrics.</p>
        </div>

        <form method="POST" class="space-y-2">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold text-xs py-3.5 rounded-xl uppercase tracking-widest transition shadow-lg shadow-blue-600/20 cursor-pointer mt-6 block">
                Verify Credentials
            </button>
        </form>

        <div class="text-center mt-6 pt-5 border-t border-white/5">
            <p class="text-xs text-slate-500">New candidate? <a href="{% url 'register' %}" class="text-blue-400 hover:underline font-semibold ml-1">Establish Access Profile</a></p>
        </div>
    </div>

</body>
</html>
