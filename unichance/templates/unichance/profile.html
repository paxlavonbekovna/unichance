<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniChance - Profile Configuration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: radial-gradient(circle at top right, #131c35 0%, #070b14 100%); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .premium-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
        }
        input {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: white !important;
            border-radius: 14px !important;
            padding: 12px 16px !important;
            outline: none !important;
            transition: all 0.3s ease !important;
            width: 100%;
        }
        input:focus { border-color: rgba(59, 130, 246, 0.5) !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.15) !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-xl premium-card rounded-3xl p-8 relative overflow-hidden">
        
        <div class="flex items-center justify-between mb-8 pb-5 border-b border-white/5">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500/20 to-indigo-500/5 border border-blue-500/30 text-blue-400 flex items-center justify-center text-xl shadow-[0_0_20px_rgba(59,130,246,0.25)]">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-tight">Academic Profile</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Calibrate variables for live eligibility matching.</p>
                </div>
            </div>
            <a href="{% url 'unichance_dashboard' %}" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-900 border border-white/5 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400"><i class="fa-solid fa-award text-indigo-400 mr-1.5"></i> Scholastic SAT Score</label>
                <input type="number" name="sat_score" value="{{ profile.sat_score }}" placeholder="e.g. 1450" min="400" max="1600">
                <span class="text-[10px] text-slate-500 block">Accepted range: 400 - 1600</span>
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400"><i class="fa-solid fa-language text-emerald-400 mr-1.5"></i> IELTS Band Metric</label>
                <input type="number" step="0.5" name="ielts_score" value="{{ profile.ielts_score }}" placeholder="e.g. 7.5" min="0" max="9">
                <span class="text-[10px] text-slate-500 block">Accepted range: 0.0 - 9.0 scale</span>
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400"><i class="fa-solid fa-wallet text-amber-400 mr-1.5"></i> Annual Funding Budget ($)</label>
                <input type="number" name="budget" value="{{ profile.budget }}" placeholder="e.g. 25000">
                <span class="text-[10px] text-slate-500 block">Your maximum tuition threshold per fiscal year.</span>
            </div>

            <div class="pt-4 border-t border-white/5 flex gap-4">
                <a href="{% url 'unichance_dashboard' %}" class="flex-1 bg-slate-900 hover:bg-slate-800 border border-white/5 text-slate-400 hover:text-white font-bold text-xs py-3.5 rounded-xl uppercase tracking-widest text-center transition">
                    Discard
                </a>
                <button type="submit" class="flex-1 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold text-xs py-3.5 rounded-xl uppercase tracking-widest transition shadow-lg shadow-blue-600/20 cursor-pointer">
                    Commit Changes
                </button>
            </div>
        </form>
    </div>

</body>
</html>
